name: Setup SSH
description: Set up SSH agent, private key, and client config
inputs:
  ssh-private-key:
    description: "Private SSH key to register in the SSH agent"
    required: false
  ssh-known-hosts:
    description: "SSH known hosts to be added"
    required: false
runs:
  using: "composite"
  steps:
    - name: Set up SSH
      shell: bash
      run: ${{ github.action_path }}/bin/setup-ssh
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
